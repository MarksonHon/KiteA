[package]
name = "kite_a"
version = "0.1.0"
edition = "2021"
description = "A v2rayA-like Web frontend for the Shoes proxy, written in Rust"

[[bin]]
name = "kite_a"
path = "src/main.rs"

[dependencies]
actix-web     = "4"
actix-cors    = "0.7"
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
sqlx          = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
jsonwebtoken  = "9"
bcrypt        = "0.15"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
log           = "0.4"
env_logger    = "0.11"
anyhow        = "1"
thiserror     = "1"
once_cell     = "1"
dirs          = "5"
rust-embed    = { version = "8", features = ["include-exclude"] }
mime_guess    = "2.0"
base64        = "0.22"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
